<!DOCTYPE html>
<html>
<head>
    <title>HTML Layout Example</title>

    <style>
        body{
            font-family: Arial;
            margin: 0;
        }

        .header{
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }

        .menu{
            background-color: lightgray;
            width: 25%;
            height: 300px;
            float: left;
            padding: 15px;
        }

        .content{
            background-color: white;
            width: 75%;
            height: 300px;
            float: left;
            padding: 15px;
        }

        .footer{
            background-color: lightgreen;
            clear: both;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Website Header</h1>
    </div>

    <div class="menu">
        <h3>Menu</h3>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="content">
        <h2>Main Content</h2>
        <p>This is the main area of the webpage layout.</p>
    </div>

    <div class="footer">
        <p>Website Footer</p>
    </div>

</body>
</html>
