<!DOCTYPE html>
<html>
<head>
    <title>HTML iframe Example</title>
</head>
<body>

    <h2>Using iframe in HTML</h2>

    <p>The webpage below is displayed inside an iframe:</p>

    <iframe 
        src="https://www.wikipedia.org" 
        width="500" 
        height="300"
        title="Wikipedia">
    </iframe>

</body>
</html>
