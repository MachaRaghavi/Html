<!DOCTYPE html>
<html>
<head>
    <title>HTML Graphics Example</title>
</head>
<body>

    <h2>HTML Graphics using SVG</h2>

    <!-- SVG Graphics -->
    <svg width="400" height="250" style="border:2px solid black;">

        <!-- Rectangle -->
        <rect x="20" y="20" width="100" height="60"
              fill="skyblue" stroke="black" stroke-width="2"/>

        <!-- Circle -->
        <circle cx="200" cy="60" r="40"
                fill="orange" stroke="black" stroke-width="2"/>

        <!-- Line -->
        <line x1="20" y1="150" x2="350" y2="150"
              stroke="green" stroke-width="4"/>

        <!-- Ellipse -->
        <ellipse cx="300" cy="60" rx="50" ry="30"
                 fill="pink" stroke="black" stroke-width="2"/>

        <!-- Text -->
        <text x="120" y="220" font-size="24" fill="blue">
            HTML Graphics
        </text>

    </svg>

</body>
</html>
