<!DOCTYPE html>
<html>
<head>
    <title>HTML Button Types</title>
</head>
<body>
    <h2>Different Types of Buttons</h2>

    <!-- Normal Button -->
    <button type="button">
        Normal Button
    </button>
    <br><br>
    <!-- Submit Button -->
    <form>
        Name:
        <input type="text">
        <input type="submit" value="Submit Button">
    </form>
    <br>

    <!-- Reset Button -->
    <form>
        Age:
        <input type="text">

        <input type="reset" value="Reset Button">
    </form>
    <br>
    <!-- Image Button -->
    <form>
        <input type="image"
               src="https://via.placeholder.com/80"
               alt="Image Button">
    </form>
    <br>
    <!-- Disabled Button -->
    <button disabled>
        Disabled Button
    </button>

</body>
</html>
